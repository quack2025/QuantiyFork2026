[project]
name = "quantipymrx"
version = "0.1.0"
description = "Modern survey data analysis engine for market research"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Talk2Data Team"}
]
keywords = [
    "survey",
    "market-research",
    "spss",
    "crosstab",
    "statistics",
    "data-analysis"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    # Core data handling
    "pandas>=2.0",
    "numpy>=1.24",

    # SPSS file support
    "pyreadstat>=1.2",

    # Statistics
    "scipy>=1.11",

    # Data validation
    "pydantic>=2.0",

    # Excel export
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Full installation with all export formats
full = [
    "python-pptx>=0.6",      # PowerPoint export
    "reportlab>=4.0",        # PDF export
    "xlsxwriter>=3.1",       # Advanced Excel
]

# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pandas-stubs",
]

# Documentation
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/talk2data/quantipymrx"
Documentation = "https://quantipymrx.readthedocs.io"
Repository = "https://github.com/talk2data/quantipymrx"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantipymrx"]

[tool.pytest.ini_options]
testpaths = ["quantipymrx/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
