[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "quantipymrx"
version = "0.1.0"
description = "Modern Python library for Market Research data analysis"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyreadstat>=1.2",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
gsheets = ["gspread>=5.0"]
all = ["openpyxl>=3.1", "gspread>=5.0"]

[tool.setuptools.packages.find]
include = ["quantipymrx*"]
